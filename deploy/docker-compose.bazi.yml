# ════════════════════════════════════════════════════════════════
#  KHỐI DÁN VÀO BuilderCMS/docker-compose.yml
# ════════════════════════════════════════════════════════════════
#
# File này KHÔNG chạy độc lập. Nó là 4 phần để dán vào đúng chỗ trong
# docker-compose.yml của BuilderCMS — theo đúng cách lovecounter và
# project-manager đang làm: repo riêng, service block nằm trong file chung.
#
# Vì sao không dựng stack riêng: nginx và certbot bên đó đã phục vụ
# sincely.io.vn, mà bazi.sincely.io.vn là subdomain của nó. Dựng nginx thứ hai
# thì hai tiến trình tranh nhau cổng 80 và 443.
#
# Đường dẫn ../Web-Bazi-Global tính từ BuilderCMS/, giống ../LoveCounter/
# love-counter — tức clone repo này nằm cạnh BuilderCMS trên server.

# ─────────────────────────────────────────────────────────────────
#  PHẦN 1 — dán vào `services:`, đặt sau khối LOVE COUNTER
# ─────────────────────────────────────────────────────────────────

  # ================================================================
  #  BÁT TỰ (bazi.sincely.io.vn) — repo riêng
  # ================================================================
  # Source: ../Web-Bazi-Global (clone git riêng)

  # Postgres riêng, không dùng chung sqlserver: schema của app này đặc thù
  # Postgres (Prisma migrations, @db.Date, enum). Không mở cổng ra ngoài —
  # chỉ các container trong stack gọi được.
  bazi-db:
    image: postgres:17-alpine
    container_name: bazi-db
    environment:
      POSTGRES_USER: bazi
      POSTGRES_PASSWORD: ${BAZI_DB_PASSWORD:?set BAZI_DB_PASSWORD}
      POSTGRES_DB: bazi
    volumes:
      - bazi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bazi -d bazi']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Chạy migration rồi thoát. Service bazi đợi nó xong mới lên, nên không bao
  # giờ có chuyện server chạy trên schema không khớp.
  bazi-migrate:
    build:
      context: ../Web-Bazi-Global
      dockerfile: Dockerfile
      target: migrator
    image: bazi-migrate:latest
    container_name: bazi-migrate
    environment:
      DATABASE_URL: postgresql://bazi:${BAZI_DB_PASSWORD:?set BAZI_DB_PASSWORD}@bazi-db:5432/bazi?schema=public
    depends_on:
      bazi-db:
        condition: service_healthy
    restart: 'no'

  bazi:
    build:
      context: ../Web-Bazi-Global
      dockerfile: Dockerfile
      target: runner
    image: bazi-web:latest
    container_name: bazi
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://bazi:${BAZI_DB_PASSWORD:?set BAZI_DB_PASSWORD}@bazi-db:5432/bazi?schema=public

      # Auth.js cần biết origin thật khi chạy sau proxy — nó không tự suy ra
      # được từ request.
      AUTH_URL: https://bazi.sincely.io.vn
      AUTH_SECRET: ${BAZI_AUTH_SECRET:?set BAZI_AUTH_SECRET}
      AUTH_TRUST_HOST: 'true'

      AUTH_GOOGLE_ID: ${BAZI_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${BAZI_GOOGLE_SECRET:-}

      # Không bắt buộc. Thiếu key thì app dùng bộ render tất định — luận giải
      # vẫn có, chỉ mộc hơn.
      ANTHROPIC_API_KEY: ${BAZI_ANTHROPIC_API_KEY:-}

      CRON_SECRET: ${BAZI_CRON_SECRET:?set BAZI_CRON_SECRET}
      RESEND_API_KEY: ${BAZI_RESEND_API_KEY:-}
      EMAIL_FROM: ${BAZI_EMAIL_FROM:-Bát Tự <onboarding@resend.dev>}
    depends_on:
      bazi-db:
        condition: service_healthy
      bazi-migrate:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Gọi digest mỗi giờ một lần. Endpoint tự xác định ai tới giờ nhận bằng cách
  # so giờ gửi đã chọn với múi giờ của từng người, nên một nhịp mỗi giờ phục vụ
  # được mọi múi giờ; ghi bản luận giải chính là dấu đã gửi, nên gọi lại trong
  # cùng giờ không tạo email thứ hai.
  bazi-cron:
    image: alpine:3.20
    container_name: bazi-cron
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
             while :; do
               sleep $$(( 3600 - $$(date +%s) % 3600 ));
               curl -fsS -m 280 -H \"authorization: Bearer $$CRON_SECRET\" \
                 http://bazi:3000/api/cron/daily-digest || echo 'digest call failed';
             done"
    environment:
      CRON_SECRET: ${BAZI_CRON_SECRET:?set BAZI_CRON_SECRET}
    depends_on:
      - bazi
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────────
#  PHẦN 2 — thêm vào khối `volumes:` ở cuối file
# ─────────────────────────────────────────────────────────────────
#
#   bazi-pgdata:

# ─────────────────────────────────────────────────────────────────
#  PHẦN 3 — thêm `bazi` vào `depends_on:` của service nginx
# ─────────────────────────────────────────────────────────────────
#
#   nginx:
#     depends_on:
#       ...
#       - lovecounter
#       - bazi          ← thêm dòng này

# ─────────────────────────────────────────────────────────────────
#  PHẦN 4 — thêm vào DEPLOY NOTES ở cuối file
# ─────────────────────────────────────────────────────────────────
#
# ─── BÁT TỰ (bazi.sincely.io.vn) ────────────────────────────────
# Repo nằm ở ../Web-Bazi-Global (clone git riêng).
#
# Env cần khai báo trong .env (cùng folder docker-compose.yml):
#   BAZI_DB_PASSWORD=<openssl rand -base64 32>
#   BAZI_AUTH_SECRET=<openssl rand -hex 48>
#   BAZI_CRON_SECRET=<openssl rand -hex 24>
#   BAZI_ANTHROPIC_API_KEY=...   (optional — thiếu thì luận giải dùng bản mộc)
#   BAZI_RESEND_API_KEY=...      (optional — thiếu thì không gửi email)
#   BAZI_GOOGLE_ID=...           (optional — thiếu thì ẩn nút Google)
#   BAZI_GOOGLE_SECRET=...
#
# SSL cert lần đầu (chưa có cert thì nginx không start được với bazi.conf,
# nên xin cert TRƯỚC rồi mới copy file conf vào):
#   docker compose up -d --build bazi-db bazi-migrate bazi bazi-cron
#   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
#     -d bazi.sincely.io.vn
#   cp ../Web-Bazi-Global/deploy/nginx/bazi.conf nginx/conf.d/bazi.conf
#   docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload
#
# Deploy / cập nhật code (sau khi git pull repo Web-Bazi-Global):
#   docker compose up -d --build bazi-migrate bazi
#
# Lưu ý: PHẢI build bazi-migrate cùng lúc. Nó chạy migration rồi thoát, bazi
#         đợi nó qua service_completed_successfully. migrate deploy chỉ chạy
#         xuôi theo các file migration đã commit, không tự sinh và không reset.
#
# Backup: service `backup` chỉ backup SQL Server, KHÔNG bao gồm Postgres này.
#   docker compose exec -T bazi-db pg_dump -U bazi bazi | gzip > bazi-$(date +%F).sql.gz
#
# Check dung lượng:
#   docker system df -v | grep bazi
