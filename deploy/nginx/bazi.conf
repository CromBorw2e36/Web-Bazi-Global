# Bát Tự — bazi.sincely.io.vn
#
# Copy to BuilderCMS/nginx/conf.d/bazi.conf.
#
# Same shape as sincely.conf, which serves the parent domain from the same nginx
# and the same certbot webroot. The certificate is its own, not a wildcard: the
# existing sincely.io.vn cert covers the apex and www, and adding a subdomain to
# it would mean reissuing a certificate other sites depend on.

# ─── Redirect HTTP → HTTPS + ACME challenge ─────────────────
server {
    listen 80;
    server_name bazi.sincely.io.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Main HTTPS ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name bazi.sincely.io.vn;

    ssl_certificate     /etc/letsencrypt/live/bazi.sincely.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bazi.sincely.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # No uploads anywhere in this app — the largest body it ever receives is a
    # journal entry, capped at 4000 characters by the server action.
    client_max_body_size 1m;

    # Next.js build assets are content-hashed, so they can be cached hard and
    # never revalidated.
    location /_next/static/ {
        proxy_pass http://bazi:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The digest endpoint is driven by the bazi-cron container over the internal
    # network. Nothing outside needs it, and leaving it reachable would put an
    # expensive job one guessed secret away.
    location /api/cron/ {
        return 404;
    }

    location / {
        proxy_pass http://bazi:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Generating a reading calls an external model. The upstream gives up
        # first and falls back to its own renderer; nginx must not cut in before
        # that happens, or the user gets a gateway error instead of a plainer
        # reading.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    server_tokens off;
}
