# ┌─────────────────────────────────────────────────────────────┐
# │ DÁN VÀO BuilderCMS/docker-compose.yml — 3 việc              │
# ├─────────────────────────────────────────────────────────────┤
# │ 1. Cả khối bên dưới  →  dán vào NGAY TRƯỚC dòng `volumes:`  │
# │ 2. Thêm  bazi-pgdata:      vào dưới dòng `volumes:`         │
# │ 3. Thêm  - bazi            vào depends_on: của nginx        │
# └─────────────────────────────────────────────────────────────┘
#
# Nhìn cho dễ hình dung, file sau khi dán xong:
#
#   services:
#     lovecounter:
#       ...
#     bazi-db:            ← khối này
#     bazi-migrate:       ←
#     bazi:               ←
#     bazi-cron:          ←
#     nginx:
#       depends_on:
#         - lovecounter
#         - bazi          ← việc 3
#
#   volumes:
#     lovecounter-data:
#     bazi-pgdata:        ← việc 2
#
# Thụt lề 2 dấu cách, giống lovecounter. Đường dẫn ../Web-Bazi-Global tính từ
# chỗ đặt docker-compose.yml.
#
# ══════════════════ TỪ ĐÂY TRỞ XUỐNG LÀ PHẦN CẦN DÁN ══════════════════

  # ================================================================
  #  BÁT TỰ (bazi.sincely.io.vn) — repo riêng
  # ================================================================
  # Source: ../Web-Bazi-Global (clone git riêng)

  # Postgres riêng, không dùng chung sqlserver. Không mở cổng ra ngoài.
  bazi-db:
    image: postgres:17-alpine
    container_name: bazi-db
    environment:
      POSTGRES_USER: bazi
      POSTGRES_PASSWORD: ${BAZI_DB_PASSWORD:?set BAZI_DB_PASSWORD}
      POSTGRES_DB: bazi
    volumes:
      - bazi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bazi -d bazi']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Chạy migration rồi thoát. bazi đợi nó xong mới lên.
  bazi-migrate:
    build:
      context: ../Web-Bazi-Global
      dockerfile: Dockerfile
      target: migrator
    image: bazi-migrate:latest
    container_name: bazi-migrate
    environment:
      DATABASE_URL: postgresql://bazi:${BAZI_DB_PASSWORD:?set BAZI_DB_PASSWORD}@bazi-db:5432/bazi?schema=public
    depends_on:
      bazi-db:
        condition: service_healthy
    restart: 'no'

  bazi:
    build:
      context: ../Web-Bazi-Global
      dockerfile: Dockerfile
      target: runner
    image: bazi-web:latest
    container_name: bazi
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://bazi:${BAZI_DB_PASSWORD:?set BAZI_DB_PASSWORD}@bazi-db:5432/bazi?schema=public
      AUTH_URL: https://bazi.sincely.io.vn
      AUTH_SECRET: ${BAZI_AUTH_SECRET:?set BAZI_AUTH_SECRET}
      AUTH_TRUST_HOST: 'true'
      AUTH_GOOGLE_ID: ${BAZI_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${BAZI_GOOGLE_SECRET:-}
      ANTHROPIC_API_KEY: ${BAZI_ANTHROPIC_API_KEY:-}
      CRON_SECRET: ${BAZI_CRON_SECRET:?set BAZI_CRON_SECRET}
      RESEND_API_KEY: ${BAZI_RESEND_API_KEY:-}
      EMAIL_FROM: ${BAZI_EMAIL_FROM:-Bát Tự <onboarding@resend.dev>}
    depends_on:
      bazi-db:
        condition: service_healthy
      bazi-migrate:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Gọi digest mỗi giờ một lần cho email tử vi hằng ngày.
  bazi-cron:
    image: alpine:3.20
    container_name: bazi-cron
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
             while :; do
               sleep $$(( 3600 - $$(date +%s) % 3600 ));
               curl -fsS -m 280 -H \"authorization: Bearer $$CRON_SECRET\" \
                 http://bazi:3000/api/cron/daily-digest || echo 'digest call failed';
             done"
    environment:
      CRON_SECRET: ${BAZI_CRON_SECRET:?set BAZI_CRON_SECRET}
    depends_on:
      - bazi
    restart: unless-stopped

# ══════════════════ HẾT PHẦN CẦN DÁN ══════════════════
#
# Dán xong kiểm tra:   docker compose config --services | grep bazi
# Phải ra 4 dòng. Nếu báo "volumes.bazi additional properties not allowed"
# nghĩa là khối bị dán nhầm xuống dưới `volumes:` — kéo lên trên dòng đó.
#
# Env cần có trong .env cùng thư mục:
#   BAZI_DB_PASSWORD=<openssl rand -hex 24>   # hex, KHÔNG base64: mật khẩu này
#                                            # nằm trong URL, dấu / sẽ cắt sai
#   BAZI_AUTH_SECRET=<openssl rand -hex 48>
#   BAZI_CRON_SECRET=<openssl rand -hex 24>
#   BAZI_ANTHROPIC_API_KEY=...   (không có cũng chạy, luận giải mộc hơn)
#   BAZI_RESEND_API_KEY=...      (không có thì không gửi email)
