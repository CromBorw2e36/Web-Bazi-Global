services:
  postgres:
    image: postgres:17-alpine
    container_name: bazi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bazi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bazi_dev_password}
      POSTGRES_DB: bazi
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - bazi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bazi -d bazi']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bazi-pgdata:
