# LOCAL DEVELOPMENT ONLY — not the production stack.
#
# Production lives in deploy/: the app joins the shared BuilderCMS compose stack
# behind its nginx and certbot, because bazi.sincely.io.vn is a subdomain of a
# site that stack already serves. See deploy/README.md.
#
# This file exists so `npm run dev` has a database. Port 5433, not 5432, to stay
# clear of anything already listening locally.
#
#   docker compose up -d      # start
#   docker compose down       # stop, keeping data
#   docker compose down -v    # stop and delete the volume

services:
  postgres:
    image: postgres:17-alpine
    container_name: bazi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bazi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bazi_dev_password}
      POSTGRES_DB: bazi
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - bazi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bazi -d bazi']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bazi-pgdata:
